services:
  tigerhawk-frontend:
    build:
      context: ../
      dockerfile: docker-for-next/Dockerfile
    container_name: tigerhawk-frontend
    ports:
      - "3000:3000"
    volumes:
      - ../src:/src
      - /src/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    